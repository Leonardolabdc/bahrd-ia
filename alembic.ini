; Alembic — migrações do MySQL (camada operacional).
; A URL NÃO fica aqui: env.py a monta a partir de Settings, para que o mesmo
; arquivo sirva Docker local e MySQL HeatWave sem edição.

[alembic]
script_location = migrations/mysql
prepend_sys_path = src:.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
