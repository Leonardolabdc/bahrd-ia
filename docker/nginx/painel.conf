server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # A aplicação nunca termina TLS — isso é do OCI Load Balancer (doc 02 §3.4)
    absolute_redirect off;

    # Log em JSON no stdout: é o que OCI Logging e `docker logs` esperam
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # config.js é gerado no boot pelo entrypoint — nunca pode ser cacheado
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /config.js =404;
    }

    # Assets com hash no nome: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
