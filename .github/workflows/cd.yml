# ============================================================================
# Entrega contínua. Um push na `main` publica sozinho.
#
#   build  →  deploy dev  →  deploy prod
#
# Os dois deploys usam GitHub Environments, e é isso que torna a separação
# real e não decorativa: `dev` e `prod` têm segredos próprios, apontam para
# máquinas diferentes e nunca compartilham valor nenhum. Um segredo cadastrado
# em `dev` é invisível para o job de `prod`, e vice-versa.
#
# Produção só é tocada depois que os smoke tests passaram em dev. Se falharem
# em prod, o rollback é automático — o job não termina verde deixando o sistema
# quebrado no ar.
#
# A imagem é etiquetada por commit (`sha-a1b2c3d`), nunca `latest`. Etiqueta que
# se move não identifica versão, e sem versão identificada não existe rollback.
# ============================================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (vazio = o commit atual)"
        required: false

concurrency:
  # Nunca dois deploys ao mesmo tempo na mesma máquina. E aqui, ao contrário do
  # CI, NÃO se cancela o que está em andamento: cancelar um deploy no meio deixa
  # a máquina num estado que ninguém escolheu.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────── Build ───────────────────────────────
  build:
    name: Construir e publicar imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      dono: ${{ steps.meta.outputs.dono }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Definir a etiqueta e o dono
        run: |
          tag="${{ inputs.tag }}"
          [[ -n "$tag" ]] || tag="sha-$(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # ⚠️ Minúsculas, obrigatoriamente.
          #
          # `github.repository_owner` devolve o nome como o usuário o escreveu
          # — aqui, com maiúsculas. O GHCR recusa: "repository name must be
          # lowercase". O build falha na VALIDAÇÃO da etiqueta, antes de
          # construir qualquer coisa, então o erro não aparece no log do Docker
          # e sim numa linha só do buildx.
          dono=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "dono=$dono" >> "$GITHUB_OUTPUT"

          echo "Publicando ghcr.io/$dono/bahrd-{backend,web}:$tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As duas imagens em paralelo seria mais rápido, mas em jobs separados o
      # cache do buildx não é compartilhado e o ganho se perde. Aqui, em
      # sequência com cache do próprio Actions, o build fica em ~2 min.
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.dono }}/bahrd-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Painel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.dono }}/bahrd-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ──────────────────────────── Deploy · dev ────────────────────────────
  dev:
    name: Deploy · desenvolvimento
    needs: build
    runs-on: ubuntu-latest
    # Pulado — e não falho — enquanto o deploy não estiver configurado. Um job
    # vermelho por configuração ausente treina todo mundo a ignorar pipeline
    # vermelho.
    #
    # ⚠️ O guarda é uma variável de **repositório**, e não de Environment. O `if`
    # de um job é avaliado ANTES de o ambiente ser resolvido, então `vars` aqui
    # só enxerga org e repositório — uma variável de Environment leria vazia
    # sempre, e o job ficaria eternamente pulado sem ninguém entender por quê.
    if: vars.DEPLOY_HABILITADO == 'true'
    environment:
      name: dev
      url: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar na maquina de dev
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/bahrd
            git fetch --all --prune
            git checkout --force ${{ github.sha }}
            ./infra/deploy/deploy.sh ${{ needs.build.outputs.tag }}

      - name: Smoke tests
        env:
          AMBIENTE_ESPERADO: dev
        run: bash tests/smoke/smoke.sh "${{ vars.BASE_URL }}"

  # ─────────────────────────── Deploy · produção ───────────────────────────
  prod:
    name: Deploy · producao
    needs: [build, dev]
    # `always()` porque `dev` pulado faria `prod` ser pulado junto por herança.
    # A condição real é: dev não pode ter FALHADO, e o deploy precisa estar
    # habilitado. Mesma observação do job acima sobre `vars` de repositório.
    if: >-
      always()
      && needs.dev.result != 'failure'
      && needs.build.result == 'success'
      && vars.DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar em producao
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/bahrd
            git fetch --all --prune
            git checkout --force ${{ github.sha }}
            ./infra/deploy/deploy.sh ${{ needs.build.outputs.tag }}

      - name: Smoke tests
        id: smoke
        env:
          AMBIENTE_ESPERADO: prd-poc
        run: bash tests/smoke/smoke.sh "${{ vars.BASE_URL }}"

      # Só roda se o passo acima falhou. Um deploy que quebra e fica no ar é
      # pior do que um deploy que não aconteceu.
      - name: Rollback automatico
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/bahrd
            ./infra/deploy/rollback.sh

      - name: Avisar que houve rollback
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Os smoke tests falharam em producao e o rollback automatico rodou."
          echo "A versao anterior esta no ar. Confira os logs do passo de rollback."
          exit 1
